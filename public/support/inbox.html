<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atendimentos · Pátio CRM</title><link rel="stylesheet" href="/api/platform/support-desk/assets/support.css"><script defer src="/api/platform/support-desk/assets/inbox.js"></script></head>
